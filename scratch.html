<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ちょっと休憩</title>

<style>
body{
    text-align:center;
    font-family:sans-serif;
    margin-top:50px;
}

.card{
    position:relative;
    width:370px;
    height:246px;
    margin:auto;
    border:2px solid #333;
}

#result{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
    font-weight:bold;
    background:#fff8dc;
}

canvas{
    position:absolute;
    top:0;
    left:0;
}
</style>

</head>
<body>
<h2>全問正解🎉</h2>
<div class="card">
    <img id="rewardImage" width="370" height="246">
    <canvas id="scratch" width="370" height="246"></canvas>
</div>

<script>
const imageMap = {
    "AIのブーム": "scratch/ai01.png",
    "AIエージェント": "scratch/agent01.png",
    "RAG": "scratch/rag01.png",
    "AI新法": "scratch/ailaw01.png",
    "機械学習": "scratch/ML01.png",
    "ニューラルネットワーク": "scratch/NN01.png"
};

const canvas = document.getElementById("scratch");
const ctx = canvas.getContext("2d");
const category = localStorage.getItem("category");
document.getElementById("rewardImage").src = imageMap[category];

console.log(category);
console.log(imageMap[category]);


ctx.fillStyle = "silver";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle = "black";
ctx.font = "24px sans-serif";
ctx.fillText("マウスや指でこすってね",50,80);

let scratching = false;

function scratch(x,y){
    ctx.globalCompositeOperation = "destination-out";
    ctx.beginPath();
    ctx.arc(x,y,20,0,Math.PI*2);
    ctx.fill();
}

canvas.addEventListener("mousedown",()=>{
    scratching=true;
});

canvas.addEventListener("mouseup",()=>{
    scratching=false;
});

canvas.addEventListener("mousemove",(e)=>{
    if(!scratching) return;

    const rect=canvas.getBoundingClientRect();

    scratch(
        e.clientX-rect.left,
        e.clientY-rect.top
    );
});

canvas.addEventListener("touchmove",(e)=>{
    const rect=canvas.getBoundingClientRect();

    scratch(
        e.touches[0].clientX-rect.left,
        e.touches[0].clientY-rect.top
    );
});

</script>
<button onclick="location.href='index.html'" style="margin-top: 20px;">最初の画面へ戻る</button>

</body>
</html>
